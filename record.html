<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa Companion — Voice Recording Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --crimson: #C41E3A; --gold: #D4A017; --dark: #0D0D1A; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Nunito', sans-serif; background: var(--dark); color: #fff; min-height: 100vh; }

        .header {
            text-align: center; padding: 40px 24px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .header h1 { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 700; }
        .header h1 span { color: var(--gold); }
        .header p { color: rgba(255,255,255,0.5); font-size: 14px; margin-top: 8px; }

        .progress-bar {
            display: flex; justify-content: center; gap: 8px; padding: 20px 24px;
        }
        .prog-dot {
            width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 13px; font-weight: 700;
            background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.3); cursor: pointer;
            transition: all 0.3s;
        }
        .prog-dot.active { background: var(--crimson); color: #fff; }
        .prog-dot.done { background: rgba(0,180,80,0.3); color: #4f4; }

        .clip-container {
            max-width: 700px; margin: 0 auto; padding: 20px 24px;
        }

        .clip-card {
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px; padding: 32px; margin-bottom: 20px;
        }
        .clip-num {
            font-size: 12px; color: var(--gold); text-transform: uppercase; letter-spacing: 2px;
            font-weight: 700; margin-bottom: 8px;
        }
        .clip-image {
            font-size: 12px; color: rgba(255,255,255,0.3); margin-bottom: 16px;
        }
        .clip-script {
            font-family: 'Playfair Display', serif; font-size: 18px; line-height: 1.7;
            color: rgba(255,255,255,0.85); padding: 20px; background: rgba(255,255,255,0.03);
            border-radius: 12px; border-left: 3px solid var(--gold);
        }

        .controls {
            display: flex; gap: 12px; margin-top: 24px; align-items: center; flex-wrap: wrap;
        }
        .btn {
            padding: 14px 28px; border: none; border-radius: 12px; font-family: 'Nunito', sans-serif;
            font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; gap: 8px;
        }
        .btn-record { background: var(--crimson); color: #fff; }
        .btn-record:hover { background: #e0223f; transform: scale(1.02); }
        .btn-record.recording { background: #ff3355; animation: pulse 1s infinite; }
        .btn-stop { background: rgba(255,255,255,0.1); color: #fff; }
        .btn-stop:hover { background: rgba(255,255,255,0.2); }
        .btn-download { background: rgba(212,160,23,0.2); color: var(--gold); border: 1px solid rgba(212,160,23,0.3); }
        .btn-download:hover { background: rgba(212,160,23,0.3); }
        .btn-nav { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6); }
        .btn-nav:hover { background: rgba(255,255,255,0.15); color: #fff; }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,51,85,0.5); }
            50% { box-shadow: 0 0 0 12px rgba(255,51,85,0); }
        }

        .timer {
            font-variant-numeric: tabular-nums; font-size: 24px; font-weight: 700;
            color: rgba(255,255,255,0.4); min-width: 70px;
        }
        .timer.active { color: var(--crimson); }

        .playback {
            margin-top: 16px; display: none; align-items: center; gap: 12px;
            padding: 16px; background: rgba(255,255,255,0.03); border-radius: 12px;
        }
        .playback.has-recording { display: flex; }
        .playback audio { flex: 1; height: 36px; }

        .nav-row {
            display: flex; justify-content: space-between; margin-top: 20px;
        }

        .download-all {
            text-align: center; padding: 30px 24px 60px;
        }
        .download-all .btn {
            margin: 0 auto; font-size: 18px; padding: 18px 48px;
        }
        .status-msg {
            text-align: center; margin-top: 12px; font-size: 13px;
            color: rgba(255,255,255,0.4);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Casa <span>Companion</span> — Voice Studio</h1>
        <p>Record your 10 narration clips. Take your time. Re-record as many times as you want.</p>
    </div>

    <div class="progress-bar" id="progressBar"></div>

    <div class="clip-container" id="clipContainer"></div>

    <div class="download-all" id="downloadAll" style="display:none;">
        <button class="btn btn-download" onclick="downloadAllZip()" style="font-size:18px; padding:18px 48px;">Download All 10 Clips</button>
        <div class="status-msg" id="statusMsg"></div>
    </div>

    <script>
    const CLIPS = [
        {
            num: 1, image: 'scene1-father.png',
            script: `I build AI tools for business. ERP solutions. Enterprise software. When my first son was born, I wanted something that would actually get him playing, learning, and off a screen. Nothing existed. So I built one.`
        },
        {
            num: 2, image: 'life-boy-crow.png',
            script: `Started as a custom GPT on my phone. Just ChatGPT. I saw the potential, but I saw the limitations. Flew to Florida and let my nephews try it. Two and four years old. They wouldn't put it down. We were in the car and all five of us wouldn't put it down. Mom and dad jumped in. My first prototype. All of us laughing, bonding, communicating. No screen. That's when I knew.`
        },
        {
            num: 3, image: 'scene3-heroes.png',
            script: `So I built it the right way. The way I build for work. Ten companions. Each with their own personality. Corvo the Crow. Gufo the Owl. Orsetto the Bear. Coniglio the Bunny. Tartaruga the Sea Turtle. Elefante the Elephant. Leone the Lion. Delfino the Dolphin. Drago the Dragon. And Xolo.`
        },
        {
            num: 4, image: 'life-nonna-kitchen.png',
            script: `Stories in Italian, because heritage disappears in one generation if you let it. Seventy-five percent of heritage languages are lost by the third generation. Your grandmother's Italian. Your grandfather's Spanish. Their lullabies. Gone. Unless you build something to keep them.`
        },
        {
            num: 5, image: 'life-grandparent-distance.png',
            script: `Seventy million grandparents in America. Forty-two percent live in a different state than their grandchildren. They spend thousands every year. But what they really want to give can't be bought in a store. Record twelve phrases. Five minutes. That voice lives inside the toy. Grandma reads bedtime stories from a thousand miles away. Not through a screen. Through a companion the child holds and falls asleep with.`
        },
        {
            num: 6, image: 'banner-father-recording.png',
            script: `This was born from losing my mother at a very early age. Her spirit lives with my son and me. So we cloned her voice so my son could hear her. And you can too. For all family generations. When a grandparent records their voice in Casa Companion, that voice doesn't expire. It doesn't require a subscription. Your child can hear Nonna say buonanotte ten years from now. Twenty years from now. That's not a feature. That's a legacy.`
        },
        {
            num: 7, image: 'scene5-crow.png',
            script: `Teddy Ruxpin gave us a bond with a toy. Cabbage Patch made it personal. Furby gave it personality. This is what this generation deserves. But built with real AI. Seven agents built in. Stories. Languages. Sign language. Music. Brain games. Milestones. No screen. Just your voice.`
        },
        {
            num: 8, image: 'eng-exploded.png',
            script: `One electronics pod. Ten plush shells. Magnetic charging dock. Machine washable. Volume capped at eighty-five decibels. No camera. No screen. No microtransactions. Ever. Built for real kids. Built for real parents.`
        },
        {
            num: 9, image: 'packaging-unbox.png',
            script: `Casa Companion. Coming to Kickstarter May fifth, twenty twenty-six. Early bird pricing. Limited quantities. Your voice. Their companion.`
        },
        {
            num: 10, image: 'banner-crow-cinematic.png',
            script: `Everyone else announced it. We built it.`
        },
    ];

    let recordings = {};
    let currentClip = 0;
    let mediaRecorder = null;
    let recordingChunks = [];
    let timerInterval = null;
    let startTime = 0;

    function init() {
        // Build progress dots
        const bar = document.getElementById('progressBar');
        CLIPS.forEach((c, i) => {
            const dot = document.createElement('div');
            dot.className = 'prog-dot' + (i === 0 ? ' active' : '');
            dot.id = `dot-${i}`;
            dot.textContent = c.num;
            dot.onclick = () => showClip(i);
            bar.appendChild(dot);
        });
        showClip(0);
    }

    function showClip(idx) {
        currentClip = idx;
        const c = CLIPS[idx];
        const container = document.getElementById('clipContainer');

        // Update dots
        document.querySelectorAll('.prog-dot').forEach((d, i) => {
            d.className = 'prog-dot' + (i === idx ? ' active' : '') + (recordings[i] ? ' done' : '');
        });

        const hasRec = !!recordings[idx];
        container.innerHTML = `
            <div class="clip-card">
                <div class="clip-num">Clip ${c.num} of 10</div>
                <div class="clip-image">${c.image}</div>
                <div class="clip-script">${c.script}</div>
                <div class="controls">
                    <button class="btn btn-record" id="recBtn" onclick="toggleRecord()">
                        <span id="recIcon">&#9679;</span> Record
                    </button>
                    <div class="timer" id="timer">0:00</div>
                </div>
                <div class="playback ${hasRec ? 'has-recording' : ''}" id="playback">
                    ${hasRec ? `<audio controls src="${recordings[idx].url}"></audio>
                    <button class="btn btn-download" onclick="downloadClip(${idx})">Save MP3</button>` : ''}
                </div>
                <div class="nav-row">
                    <button class="btn btn-nav" onclick="showClip(${Math.max(0, idx-1)})" ${idx === 0 ? 'disabled style="opacity:0.3"' : ''}>Previous</button>
                    ${idx < 9 ? `<button class="btn btn-nav" onclick="showClip(${idx+1})">Next</button>` :
                    `<button class="btn btn-download" onclick="showDownloadAll()">All Done</button>`}
                </div>
            </div>
        `;
    }

    async function toggleRecord() {
        const btn = document.getElementById('recBtn');
        if (mediaRecorder && mediaRecorder.state === 'recording') {
            // Stop
            mediaRecorder.stop();
            btn.classList.remove('recording');
            btn.innerHTML = '<span>&#9679;</span> Record';
            clearInterval(timerInterval);
            return;
        }

        // Start recording
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            recordingChunks = [];
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' });

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) recordingChunks.push(e.data);
            };

            mediaRecorder.onstop = () => {
                stream.getTracks().forEach(t => t.stop());
                const blob = new Blob(recordingChunks, { type: 'audio/webm' });
                const url = URL.createObjectURL(blob);
                recordings[currentClip] = { blob, url };

                // Update UI
                document.querySelectorAll('.prog-dot').forEach((d, i) => {
                    if (recordings[i]) d.classList.add('done');
                });

                const pb = document.getElementById('playback');
                pb.className = 'playback has-recording';
                pb.innerHTML = `<audio controls src="${url}"></audio>
                    <button class="btn btn-download" onclick="downloadClip(${currentClip})">Save MP3</button>`;

                checkAllDone();
            };

            mediaRecorder.start();
            btn.classList.add('recording');
            btn.innerHTML = '<span>&#9632;</span> Stop';

            startTime = Date.now();
            timerInterval = setInterval(() => {
                const s = Math.floor((Date.now() - startTime) / 1000);
                document.getElementById('timer').textContent = `${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`;
                document.getElementById('timer').classList.add('active');
            }, 200);

        } catch (err) {
            alert('Microphone access denied. Check browser permissions.');
        }
    }

    function downloadClip(idx) {
        if (!recordings[idx]) return;
        const a = document.createElement('a');
        a.href = recordings[idx].url;
        a.download = `narration-${CLIPS[idx].num}.webm`;
        a.click();
    }

    function checkAllDone() {
        const done = Object.keys(recordings).length;
        if (done === 10) {
            document.getElementById('downloadAll').style.display = 'block';
        }
    }

    function showDownloadAll() {
        document.getElementById('downloadAll').style.display = 'block';
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    function downloadAllZip() {
        // Download each clip individually (no zip library needed)
        const msg = document.getElementById('statusMsg');
        let count = 0;
        for (let i = 0; i < 10; i++) {
            if (recordings[i]) {
                setTimeout(() => {
                    downloadClip(i);
                    count++;
                    msg.textContent = `Downloaded ${count} of ${Object.keys(recordings).length}...`;
                }, i * 500);
            }
        }
        setTimeout(() => {
            msg.textContent = 'All clips downloaded. Drop them in the audio/ folder and we push.';
        }, 5500);
    }

    init();
    </script>
</body>
</html>
